# Continuous integration.
#
# Runs on every push and pull request. The point is that nothing reaches the
# live site without the checks that would have caught the bugs found in the
# August 2026 audit — several of which were sitting in "complete" phases.
#
# Two jobs, deliberately split:
#
#   quality  fast (~1 min): lint, types, production build. Catches most
#            mistakes before the slow job is worth starting.
#   e2e      slow (~5 min): spins up a real Postgres via the Supabase CLI,
#            applies the migrations, seeds an admin, and drives the site in a
#            real browser.
#
# The e2e job runs against a LOCAL database. It used to be possible to run the
# suite against production, which left test data on the live website.
#
# Action versions are pinned to a major and kept current. GitHub retires the
# Node runtime an action targets — v4 targeted Node 20, which was forced onto
# Node 24 with a deprecation warning before being removed — so a stale major
# eventually stops the workflow rather than just warning about it. Only
# `node-version`, `cache`, `name`, `path` and `retention-days` are used here,
# and none of those have changed across these majors.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run — no point finishing a
# build for code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development machine. package-lock.json is written by
          # whichever npm the developer runs, and npm major versions disagree
          # about how optional peer dependencies are recorded — npm 12 resolves
          # a nested @swc/helpers for next-intl's @swc/core that npm 10 does
          # not. `npm ci` then refuses the lock it was handed. Keeping the two
          # on the same major is what stops that class of failure.
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json specifies, unlike
      # `npm install` which may quietly update things. Reproducible builds.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # The build only needs these to exist — nothing is contacted at build
          # time. Real values live in Vercel's environment settings.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          SUPABASE_SECRET_KEY: build-placeholder

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development machine. package-lock.json is written by
          # whichever npm the developer runs, and npm major versions disagree
          # about how optional peer dependencies are recorded — npm 12 resolves
          # a nested @swc/helpers for next-intl's @swc/core that npm 10 does
          # not. `npm ci` then refuses the lock it was handed. Keeping the two
          # on the same major is what stops that class of failure.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        # Boots Postgres, GoTrue (auth) and the REST API in Docker, then applies
        # everything in supabase/migrations plus supabase/seed.sql. This is the
        # same schema the live project runs, which is only true because the
        # migrations are now complete — grants included.
        #
        # `npx` resolves to the version in package-lock.json, because `supabase`
        # is a devDependency. It was not always: this used to download whatever
        # the latest CLI happened to be on the day the job ran, so a release
        # upstream could turn CI red with no change in this repository. The
        # binary itself arrives as a platform optionalDependency rather than a
        # postinstall download, which is why nothing needs adding to the
        # `allowScripts` allowlist in package.json.
        run: npx supabase start

      # Read the keys back out of the stack that just started, rather than
      # storing them.
      #
      # These used to come from `secrets.LOCAL_SUPABASE_ANON_KEY` and
      # `secrets.LOCAL_SUPABASE_SERVICE_KEY`, which were never set on the
      # repository. An unset secret interpolates to an empty string rather than
      # failing, so the web server started with no Supabase key, died with
      # "supabaseKey is required", and the job spent five minutes timing out
      # waiting for a server that had already exited. The cause was five minutes
      # upstream of the error.
      #
      # Asking the CLI is better than a secret or a hardcoded value: it needs no
      # repository configuration, works on a fork, and cannot go stale when the
      # CLI changes its key format — which it has. The project moved from the
      # legacy `ANON_KEY` JWT to `PUBLISHABLE_KEY` (`sb_publishable_…`), and the
      # secret names above still referred to the old pair.
      #
      # Nothing secret is being handled. These keys reach a Postgres on
      # 127.0.0.1 inside this runner, which is destroyed with the job.
      - name: Export local Supabase keys
        run: |
          set -euo pipefail
          npx supabase status -o env | grep -E '^[A-Z0-9_]+=' > supabase-status.env
          val() { grep "^$1=" supabase-status.env | head -1 | cut -d= -f2- | tr -d '"'; }
          url=$(val API_URL)
          pub=$(val PUBLISHABLE_KEY)
          sec=$(val SECRET_KEY)
          # Fail here, loudly, rather than letting an empty value travel onwards
          # and surface as a web server timeout. That is the whole lesson of the
          # bug this step replaces.
          if [ -z "$url" ] || [ -z "$pub" ] || [ -z "$sec" ]; then
            echo "::error::supabase status returned no keys — did the stack start?"
            cat supabase-status.env
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$pub"
            echo "SUPABASE_SECRET_KEY=$sec"
          } >> "$GITHUB_ENV"
          rm supabase-status.env

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test
        env:
          CI: "true"
          # NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY and
          # SUPABASE_SECRET_KEY arrive from $GITHUB_ENV above. They must not be
          # repeated here — a step-level `env:` overrides $GITHUB_ENV, so
          # restating them is how the empty values won in the first place.
          TEST_ADMIN_EMAIL: playwright-admin@test.local
          TEST_ADMIN_PASSWORD: playwright-test-password
          # Cloudflare's always-pass test pair, which is what allows the booking
          # flow to be tested end to end rather than stopping at the CAPTCHA.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          STRIPE_SECRET_KEY: sk_test_placeholder
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          RESEND_API_KEY: re_test_placeholder
          RESEND_FROM_EMAIL: test@example.com
          # Every browser project shares 127.0.0.1, so the real per-IP limits
          # would reject legitimate test traffic. Test-only.
          RATE_LIMIT_MULTIPLIER: "200"

      # Traces and screenshots from failures, so a red build can be diagnosed
      # without reproducing it locally.
      #
      # `playwright-report/` only exists because the CI reporter list includes
      # `html`. Without it this step had nothing to collect and said so on every
      # red build — "No files were found with the provided path" — which reads
      # like a misconfigured path and is really a missing reporter.
      #
      # `if-no-files-found: ignore` covers the case where Playwright dies before
      # writing anything at all, as it does when the web server never starts.
      # There is genuinely nothing to upload then, and a warning about it only
      # distracts from the real error further up the log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
